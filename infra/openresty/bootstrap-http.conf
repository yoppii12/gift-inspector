# 証明書を取得するまでの一時設定（docs/vps-setup.md 9章）。証明書取得後は gift-inspector.conf に置き換える。
server {
  listen 80;
  server_name gift-inspector-dev.laplust.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
  }

  location / {
    return 503 'certificate not issued yet';
  }
}
