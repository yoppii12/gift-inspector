# gift-inspector 用 OpenResty 設定（/usr/local/openresty/nginx/conf/nginx.conf に配置）
# 構成: スマホ --HTTPS--> OpenResty（TLS終端・BASIC認証・サイズ制限・静的配信）--> API(127.0.0.1:3000)
# タイムアウト値は packages/shared/src/timeouts.ts と docs/error-handling.md 3.2 に合わせる。

user www-data;
# 1GB VPS 前提。ワーカーは1つで十分（同時利用は数名）
worker_processes 1;
# パッケージ付属の systemd ユニット（PIDFile）と一致させること。違うと起動がタイムアウトする
pid /usr/local/openresty/nginx/logs/nginx.pid;
error_log /var/log/openresty/error.log warn;

events {
  worker_connections 512;
}

http {
  include mime.types;
  default_type application/octet-stream;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  charset utf-8;

  # リクエストIDを API に渡し、nginx と API のログを突き合わせられるようにする
  log_format main_json escape=json
    '{"time":"$time_iso8601","requestId":"$request_id","remote":"$remote_addr",'
    '"user":"$remote_user","method":"$request_method","uri":"$uri","status":$status,'
    '"bytesIn":$request_length,"bytesOut":$body_bytes_sent,"durationS":$request_time,'
    '"upstreamS":"$upstream_response_time","upstreamStatus":"$upstream_status","ua":"$http_user_agent"}';
  access_log /var/log/openresty/access.log main_json;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  # API への過剰なリクエストを抑える（超過は 429 / RATE_LIMITED）
  limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
  limit_req_status 429;

  upstream gift_inspector_api {
    server 127.0.0.1:3000;
    keepalive 4;
  }

  include /usr/local/openresty/nginx/conf/sites/*.conf;
}
