# gift-inspector サイト設定（/usr/local/openresty/nginx/conf/sites/ に配置）
# IPv4 のみで待ち受ける（DNS は A レコードのみ。IPv6 が無効な環境で [::] を書くと起動に失敗するため）

server {
  listen 80;
  server_name gift-inspector-dev.laplust.com;

  # Let's Encrypt の更新用
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name gift-inspector-dev.laplust.com;

  ssl_certificate     /etc/letsencrypt/live/gift-inspector-dev.laplust.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gift-inspector-dev.laplust.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:5m;
  ssl_session_timeout 10m;

  # セキュリティヘッダー。location 内で add_header を書くと server の add_header が継承されなくなるため、
  # add_header を持つ location では必ずこのファイルも include すること
  include /usr/local/openresty/nginx/conf/snippets/security-headers.conf;

  # BASIC 認証（社内検証用とデモ用で別アカウント。docs/vps-setup.md 10章）
  auth_basic "Gift Inspector";
  auth_basic_user_file /etc/gift-inspector/htpasswd;

  root /srv/gift-inspector/web;

  # --- API ---------------------------------------------------------------
  location /api/ {
    limit_req zone=api burst=20 nodelay;

    # 画像は端末側で長辺1600pxに縮小して送る（実効 1MB 前後）。API 側の上限は IMAGE_MAX_BYTES（5MB）
    client_max_body_size 8m;
    client_body_timeout 30s;

    proxy_pass http://gift_inspector_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 75s;
    # API 自身が返した 503 などはそのまま通す（DB_UNAVAILABLE などを UPSTREAM_* に化けさせない）
    proxy_intercept_errors off;

    # OpenResty 自身が返すエラーも API と同じ JSON 形式にする（文言はカタログから生成）
    include /usr/local/openresty/nginx/conf/snippets/error-pages.conf;
  }

  # error-pages.conf が参照する named location（server 直下に置く必要がある）
  include /usr/local/openresty/nginx/conf/snippets/error-locations.conf;

  # --- 静的ファイル（React） -------------------------------------------------
  location /assets/ {
    expires 30d;
    include /usr/local/openresty/nginx/conf/snippets/security-headers.conf;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /usr/local/openresty/nginx/conf/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
